[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biddesk"
version = "0.1.0"
description = "Score an incoming RFP against your past proposals and find what you cannot answer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Michael Kingsley", email = "ifeanyinwadike13@gmail.com" }]
keywords = ["rfp", "tender", "bid", "proposal", "coverage", "scoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
draft = ["anthropic>=0.30"]

[project.scripts]
biddesk = "biddesk.__main__:main"

[tool.setuptools.packages.find]
include = ["biddesk*"]
